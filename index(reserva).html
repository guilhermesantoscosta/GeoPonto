<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disputa de Territórios 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #12121e; color: #eee;
    overflow: hidden; user-select: none;
  }
  #canvas-container { position: fixed; inset: 0; }

  /* HUD superior */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 10px 16px; display: flex; gap: 20px; align-items: center;
    background: rgba(10, 10, 20, 0.85); z-index: 10;
    font-size: 14px; border-bottom: 1px solid #333;
  }
  #hud strong { color: #fff; }
  .player-dot {
    display: inline-block; width: 14px; height: 14px;
    border-radius: 50%; vertical-align: middle; margin-right: 6px;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .phase-tag {
    padding: 4px 10px; border-radius: 12px;
    background: #3a4a7a; font-size: 12px; font-weight: 600;
  }

  /* Painel lateral */
  #sidebar {
    position: fixed; top: 60px; right: 10px; width: 290px;
    background: rgba(10, 10, 20, 0.88); padding: 14px;
    border-radius: 10px; z-index: 10;
    max-height: calc(100vh - 80px); overflow-y: auto;
    border: 1px solid #333;
  }
  #sidebar h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: #8ab; margin: 12px 0 6px;
  }
  #sidebar h3:first-child { margin-top: 0; }

  button {
    padding: 9px 12px; margin: 4px 0; width: 100%;
    background: #3a4a7a; color: #fff; border: none; border-radius: 6px;
    cursor: pointer; font-size: 13px; font-weight: 500;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #4a5a9a; }
  button:disabled { background: #2a2a3a; cursor: not-allowed; opacity: 0.5; }
  button.primary { background: #2a7a4a; }
  button.primary:hover:not(:disabled) { background: #3a8a5a; }

  #territory-info { font-size: 13px; line-height: 1.5; color: #ccc; }
  #players-list { font-size: 12px; }
  .player-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 4px; border-radius: 4px; margin: 2px 0;
  }
  .player-row.current { background: rgba(255,255,255,0.08); }
  .player-row.eliminated { opacity: 0.4; text-decoration: line-through; }

  /* Log inferior */
  #log {
    position: fixed; bottom: 10px; left: 10px; width: 400px;
    max-height: 180px; overflow-y: auto;
    background: rgba(10, 10, 20, 0.85); padding: 10px;
    border-radius: 8px; font-size: 12px; z-index: 10;
    border: 1px solid #333; line-height: 1.5; color: #bbb;
  }
  #log div { margin: 2px 0; }

  /* Modal de dados */
  #dice-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  #dice-modal.active { display: flex; }
  #dice-content {
    background: #1e1e30; padding: 28px; border-radius: 14px;
    text-align: center; min-width: 340px; max-width: 90vw;
    border: 1px solid #445;
  }
  #dice-content h2 { margin-bottom: 16px; font-size: 18px; }
  .dice-comparison {
    display: flex; gap: 10px; align-items: center;
    justify-content: center; margin: 8px 0;
    padding: 8px; background: rgba(255,255,255,0.04); border-radius: 8px;
  }
  .die {
    width: 42px; height: 42px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 20px; color: #111;
    border: 2px solid transparent;
  }
  .die.winner { border-color: #4caf50; box-shadow: 0 0 12px #4caf5099; }
  .dice-result { font-size: 15px; margin: 16px 0; font-weight: 600; }
  .dice-result.conquered { color: #6f6; }
  .dice-result.failed { color: #f88; }

  /* Tela inicial */
  #start-screen {
    position: fixed; inset: 0; background: #12121e;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; z-index: 200;
  }
  #start-screen h1 { font-size: 28px; margin-bottom: 10px; }
  #start-screen p { color: #aaa; }
  #start-screen select {
    padding: 10px 16px; font-size: 16px; border-radius: 6px;
    background: #2a2a3e; color: #fff; border: 1px solid #445;
  }
  #start-screen button { width: 200px; padding: 12px; font-size: 15px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- Tela inicial -->
<div id="start-screen">
  <h1>🌍 Disputa de Territórios 3D</h1>
  <p>Escolha o número de jogadores:</p>
  <select id="player-count">
    <option value="2">2 Jogadores</option>
    <option value="3">3 Jogadores</option>
    <option value="4" selected>4 Jogadores</option>
    <option value="5">5 Jogadores</option>
    <option value="6">6 Jogadores</option>
    <option value="7">7 Jogadores</option>
    <option value="8">8 Jogadores</option>
  </select>
  <button id="start-btn" class="primary">Iniciar Jogo</button>
</div>

<!-- Canvas 3D -->
<div id="canvas-container"></div>

<!-- HUD superior -->
<div id="hud">
  <strong>Rodada: <span id="round-num">1</span></strong>
  <span id="turn-indicator">
    <span class="player-dot" id="current-dot"></span>
    <span id="current-player">—</span>
  </span>
  <span class="phase-tag" id="phase-tag">Distribuição</span>
  <span id="points-available"></span>
</div>

<!-- Painel lateral -->
<div id="sidebar">
  <h3>Ações</h3>
  <div id="action-buttons"></div>

  <h3>Território Selecionado</h3>
  <div id="territory-info">Nenhum</div>

  <h3>Jogadores</h3>
  <div id="players-list"></div>
</div>

<!-- Log -->
<div id="log"></div>

<!-- Modal de dados -->
<div id="dice-modal">
  <div id="dice-content"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TerritoryGame, TERRITORIES, PLAYER_COLORS, PLAYER_NAMES } from './game.js';

// ============================================================
// Estado global
// ============================================================
let scene, camera, renderer, controls;
let game = null;
let hexMeshes = new Map();      // territoryId -> mesh
let pointSprites = new Map();   // territoryId -> sprite
let selectedTerritory = null;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

const HEX_SIZE = 1.0;
const HEX_VISUAL_RADIUS = 0.92; // pequenos vãos entre hexágonos
const HEX_BASE_HEIGHT = 0.25;
const HEX_POINT_HEIGHT = 0.18;

// ============================================================
// Inicialização do Three.js
// ============================================================
function initScene() {
  const container = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x12121e);
  scene.fog = new THREE.Fog(0x12121e, 25, 45);

  camera = new THREE.PerspectiveCamera(
    50, window.innerWidth / window.innerHeight, 0.1, 100
  );
  camera.position.set(0, 14, 14);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2.2;
  controls.minDistance = 6;
  controls.maxDistance = 28;

  // Iluminação
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const dir = new THREE.DirectionalLight(0xffffff, 1.1);
  dir.position.set(6, 14, 8);
  scene.add(dir);
  const fill = new THREE.DirectionalLight(0x8888ff, 0.35);
  fill.position.set(-8, 6, -8);
  scene.add(fill);

  // Base escura
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ color: 0x0a0a14, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  scene.add(ground);

  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('click', onCanvasClick);
  renderer.domElement.addEventListener('pointermove', onPointerMove);

  animate();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ============================================================
// Conversão de coordenadas axiais → mundo 3D
// ============================================================
function axialToWorld(q, r) {
  const x = Math.sqrt(3) * HEX_SIZE * (q + r / 2);
  const z = 1.5 * HEX_SIZE * r;
  return { x, z };
}

// ============================================================
// Criação dos meshes do mapa
// ============================================================
function buildMapMeshes() {
  // Limpa meshes anteriores (caso reinicie)
  hexMeshes.forEach(m => scene.remove(m));
  pointSprites.forEach(s => scene.remove(s));
  hexMeshes.clear();
  pointSprites.clear();

  const geo = new THREE.CylinderGeometry(
    HEX_VISUAL_RADIUS, HEX_VISUAL_RADIUS, 1, 6
  );
  geo.rotateY(Math.PI / 6); // pointy-top

  for (const t of game.territories) {
    const mat = new THREE.MeshStandardMaterial({
      color: 0x666666,
      roughness: 0.75,
      metalness: 0.05,
      emissive: 0x000000,
      flatShading: true,
    });
    const mesh = new THREE.Mesh(geo, mat);
    const { x, z } = axialToWorld(t.q, t.r);
    mesh.position.set(x, HEX_BASE_HEIGHT / 2, z);
    mesh.userData.territoryId = t.id;
    scene.add(mesh);
    hexMeshes.set(t.id, mesh);
  }
}

// ============================================================
// Atualização visual de um território
// ============================================================
function refreshTerritory(id) {
  const t = game.territories[id];
  const mesh = hexMeshes.get(id);
  if (!mesh) return;

  // Altura proporcional aos pontos
  const height = HEX_BASE_HEIGHT + t.points * HEX_POINT_HEIGHT;
  mesh.scale.y = height;
  mesh.position.y = height / 2;

  // Cor (pastel do dono ou cinza neutro)
  if (t.owner !== null) {
    mesh.material.color.set(PLAYER_COLORS[t.owner]);
  } else {
    mesh.material.color.set(0x8a8a9a);
  }

  // Contador de pontos (sprite)
  const oldSprite = pointSprites.get(id);
  if (oldSprite) { scene.remove(oldSprite); pointSprites.delete(id); }

  if (t.points > 0) {
    const sprite = makeTextSprite(String(t.points));
    sprite.position.set(mesh.position.x, height + 0.55, mesh.position.z);
    scene.add(sprite);
    pointSprites.set(id, sprite);
  }

  // Reset de emissive (highlights são aplicados depois)
  mesh.material.emissive.setHex(0x000000);
}

function refreshAll() {
  for (const t of game.territories) refreshTerritory(t.id);
}

// Sprite de texto (canvas → textura)
function makeTextSprite(text) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 84px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 10;
  ctx.strokeStyle = '#fff';
  ctx.strokeText(text, 64, 68);
  ctx.fillStyle = '#111';
  ctx.fillText(text, 64, 68);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(0.7, 0.7, 1);
  return sp;
}

// ============================================================
// Interação com o canvas
// ============================================================
function onPointerMove(event) {
  // Hover suave
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects([...hexMeshes.values()]);
  document.body.style.cursor = hits.length ? 'pointer' : 'default';
}

function onCanvasClick(event) {
  if (!game || game.gameOver) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects([...hexMeshes.values()]);
  if (hits.length === 0) { clearSelection(); return; }

  handleTerritoryClick(hits[0].object.userData.territoryId);
}

function handleTerritoryClick(id) {
  const t = game.territories[id];
  const player = game.getCurrentPlayer();

  // ---- FASE 1: Distribuição ----
  if (game.phase === 'distribution') {
    const res = game.placePoint(id);
    if (res.ok) { refreshTerritory(id); updateUI(); }
    else showToast(res.msg);
    return;
  }

  // ---- FASE 2: Movimento ----
  if (game.phase === 'movement') {
    if (selectedTerritory === null) {
      if (t.owner === player.id && t.points > 1) {
        selectedTerritory = id;
        applyHighlights();
        updateUI();
      } else {
        showToast('Selecione um território seu com mais de 1 ponto');
      }
      return;
    }
    if (id === selectedTerritory) { clearSelection(); return; }

    const res = game.movePoint(selectedTerritory, id);
    if (res.ok) {
      refreshTerritory(selectedTerritory);
      refreshTerritory(id);
      clearSelection();
      updateUI();
    } else {
      showToast(res.msg);
    }
    return;
  }

  // ---- FASE 3: Disputa ----
  if (game.phase === 'dispute') {
    if (selectedTerritory === null) {
      if (t.owner === player.id && t.points > 1) {
        selectedTerritory = id;
        applyHighlights();
        updateUI();
      } else {
        showToast('Selecione um território seu com mais de 1 ponto');
      }
      return;
    }
    if (id === selectedTerritory) { clearSelection(); return; }

    if (!game.canAttack(selectedTerritory, id)) {
      showToast('Alvo inválido: deve ser vizinho inimigo');
      return;
    }

    const result = game.dispute(selectedTerritory, id);
    if (result.ok) {
      refreshTerritory(selectedTerritory);
      refreshTerritory(id);
      clearSelection();
      showDiceModal(result);
      updateUI();
    }
  }
}

// ============================================================
// Destaques visuais
// ============================================================
function clearHighlights() {
  hexMeshes.forEach(m => m.material.emissive.setHex(0x000000));
}

function clearSelection() {
  selectedTerritory = null;
  clearHighlights();
  updateUI();
}

function applyHighlights() {
  clearHighlights();
  if (selectedTerritory === null) return;

  const player = game.getCurrentPlayer();
  const t = game.territories[selectedTerritory];

  // Origem destacada
  const selMesh = hexMeshes.get(selectedTerritory);
  if (selMesh) selMesh.material.emissive.setHex(0xffffff);

  // Vizinhança
  for (const nid of t.neighbors) {
    const nt = game.territories[nid];
    const mesh = hexMeshes.get(nid);
    if (!mesh) continue;

    if (game.phase === 'movement') {
      if (nt.owner === null || nt.owner === player.id) {
        mesh.material.emissive.setHex(0x2a6a3a); // verde = destino válido
      }
    } else if (game.phase === 'dispute') {
      if (nt.owner !== null && nt.owner !== player.id) {
        mesh.material.emissive.setHex(0x7a2a2a); // vermelho = alvo de ataque
      }
    }
  }
}

// ============================================================
// Interface
// ============================================================
function updateUI() {
  if (!game) return;
  const player = game.getCurrentPlayer();

  document.getElementById('round-num').textContent = game.round;
  document.getElementById('current-player').textContent = player.name;
  document.getElementById('current-dot').style.background = player.color;
  document.getElementById('current-dot').style.borderColor = '#fff';

  const phaseNames = {
    distribution: '1. Distribuição',
    movement: '2. Deslocamento',
    dispute: '3. Disputa',
  };
  document.getElementById('phase-tag').textContent = phaseNames[game.phase];

  const pts = document.getElementById('points-available');
  if (game.phase === 'distribution') {
    pts.textContent = `Pontos restantes: ${player.availablePoints}`;
    pts.style.color = player.availablePoints === 0 ? '#6f6' : '#fc6';
  } else {
    pts.textContent = '';
  }

  updateActionButtons();
  updateTerritoryInfo();
  updatePlayersList();
  updateLog();
}

function updateActionButtons() {
  const wrap = document.getElementById('action-buttons');
  wrap.innerHTML = '';
  if (game.gameOver) {
    const btn = document.createElement('button');
    btn.textContent = '🔄 Novo Jogo';
    btn.className = 'primary';
    btn.onclick = () => location.reload();
    wrap.appendChild(btn);
    return;
  }

  const player = game.getCurrentPlayer();

  if (game.phase === 'distribution') {
    const btn = document.createElement('button');
    btn.className = 'primary';
    btn.textContent = player.availablePoints === 0
      ? '➡️ Ir para Deslocamento'
      : `➡️ Deslocamento (${player.availablePoints} pontos restantes)`;
    btn.onclick = () => {
      game.advanceToMovement();
      clearSelection();
      updateUI();
    };
    wrap.appendChild(btn);
  }

  if (game.phase === 'movement') {
    const btn = document.createElement('button');
    btn.className = 'primary';
    btn.textContent = '➡️ Ir para Disputa';
    btn.onclick = () => {
      game.advanceToDispute();
      clearSelection();
      updateUI();
    };
    wrap.appendChild(btn);
  }

  if (game.phase === 'dispute') {
    const btn = document.createElement('button');
    btn.className = 'primary';
    btn.textContent = '🏁 Encerrar Turno';
    btn.onclick = () => {
      game.endTurn();
      clearSelection();
      refreshAll();
      updateUI();
    };
    wrap.appendChild(btn);
  }
}

function updateTerritoryInfo() {
  const info = document.getElementById('territory-info');
  if (selectedTerritory === null) {
    info.innerHTML = '<span style="color:#666">Clique em um território</span>';
    return;
  }
  const t = game.territories[selectedTerritory];
  const ownerName = t.owner !== null ? PLAYER_NAMES[t.owner] : 'Neutro';
  const ownerColor = t.owner !== null ? PLAYER_COLORS[t.owner] : '#888';
  info.innerHTML = `
    <strong>Território #${t.id}</strong><br>
    Dono: <span class="player-dot" style="background:${ownerColor}"></span>${ownerName}<br>
    Pontos: <strong>${t.points}</strong><br>
    Vizinhos: ${t.neighbors.length}
  `;
}

function updatePlayersList() {
  const list = document.getElementById('players-list');
  list.innerHTML = '';
  game.players.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'player-row';
    if (i === game.currentPlayerIndex) row.classList.add('current');
    if (p.eliminated) row.classList.add('eliminated');
    row.innerHTML = `
      <span class="player-dot" style="background:${p.color}"></span>
      <span style="flex:1">${p.name}</span>
      <span style="color:#888">${p.territoryIds.length} 🏳️</span>
    `;
    list.appendChild(row);
  });
}

function updateLog() {
  const el = document.getElementById('log');
  el.innerHTML = game.log.slice(-15).map(l =>
    `<div>R${l.round}: ${l.msg}</div>`
  ).join('');
  el.scrollTop = el.scrollHeight;
}

// ============================================================
// Modal de dados
// ============================================================
function showDiceModal(result) {
  const modal = document.getElementById('dice-modal');
  const content = document.getElementById('dice-content');

  const comps = result.comparisons.map(c => `
    <div class="dice-comparison">
      <div class="die ${c.attackerWins ? 'winner' : ''}" 
           style="background:${result.attacker.color}">${c.attacker}</div>
      <span style="color:#888">vs</span>
      <div class="die ${!c.attackerWins ? 'winner' : ''}" 
           style="background:${result.defender.color}">${c.defender}</div>
    </div>
  `).join('');

  const resultMsg = result.conquered
    ? `🎉 TERRITÓRIO CONQUISTADO! (+${result.attackerWins} vs ${result.defenderWins})`
    : `Vitórias do atacante: ${result.attackerWins} · Derrotas: ${result.defenderWins}`;

  content.innerHTML = `
    <h2>⚔️ ${result.attacker.name} × ${result.defender.name}</h2>
    ${comps}
    <div class="dice-result ${result.conquered ? 'conquered' : 'failed'}">
      ${resultMsg}
    </div>
    <button class="primary" id="dice-continue">Continuar</button>
  `;

  document.getElementById('dice-continue').onclick = () => {
    modal.classList.remove('active');
    if (game.gameOver) {
      setTimeout(() => alert(`🏆 ${game.winner.name} venceu o jogo!`), 200);
    }
  };

  modal.classList.add('active');
}

// ============================================================
// Toast rápido
// ============================================================
let toastTimer = null;
function showToast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = `
      position:fixed;bottom:220px;left:50%;transform:translateX(-50%);
      background:rgba(200,60,60,0.95);color:#fff;padding:10px 18px;
      border-radius:8px;font-size:13px;z-index:150;pointer-events:none;
      transition:opacity 0.3s;
    `;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

// ============================================================
// Inicialização do jogo
// ============================================================
function startGame(playerCount) {
  game = new TerritoryGame(playerCount);
  buildMapMeshes();
  refreshAll();
  updateUI();
  document.getElementById('start-screen').style.display = 'none';
}

// Boot
initScene();
document.getElementById('start-btn').addEventListener('click', () => {
  const n = parseInt(document.getElementById('player-count').value, 10);
  startGame(n);
});
</script>
</body>
</html>
